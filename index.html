<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextLevel - Rental PS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== WEEK 1: NAVBAR =====
       Wembuat halaman (beranda, login, daftar). -->
  <header class="navbar">

    <!-- Gelembung hiasan -->
    <div class="bubbles" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- Logo NL + nama -->
    <a href="#beranda" class="logo">
      <img src="gambar/logo-nl.gif" alt="Logo NL NextLevel" class="logo-img">
      <span class="logo-text">Next Level</span>
    </a>

    <!-- Menu (di HP dibuka lewat tombol garis tiga, tanpa JavaScript) -->
    <nav class="menu" id="menu">
      <a href="#beranda">Beranda</a>
      <a href="#daftar-ps">Daftar PS</a>
      <a href="#cek-game">Cek Game</a>
      <a href="#login" class="btn-masuk">Masuk</a>
      <a href="#reservasi" class="btn-reservasi">Reservasi</a>
    </nav>

    <a href="#menu" class="hamburger" aria-label="Buka menu">
      <span></span><span></span><span></span>
    </a>
    <a href="#beranda" class="tutup" aria-label="Tutup menu">&#10005;</a>

  </header>

  <!-- ===== BERANDA (isi sementara, diganti di Week 2) ===== -->
  <main id="beranda">
    <p>Konten menyusul di Week 2</p>
  </main>

  <!-- ===== HALAMAN LOGIN =====
       Tombol Masuk berupa link ke #beranda. Link ini baru bisa diklik
       kalau akun dan password sudah terisi benar (diatur di CSS dengan :invalid).
       Formalitas saja, tanpa database. -->
  <section class="auth" id="login">
    <div class="auth-card">
      <img src="gambar/logo-nl-card.gif" alt="" class="auth-logo">
      <h1>Masuk</h1>

      <form>
        <label for="login-akun">Akun</label>
        <input type="text" id="login-akun" placeholder="Masukkan nama akun" autocomplete="username" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Minimal 6 karakter" minlength="6" autocomplete="current-password" required>

        <p class="auth-hint">Isi akun dan password (minimal 6 karakter) dulu ya.</p>
        <a href="#beranda" class="btn-lime">Masuk</a>
      </form>

      <p class="auth-switch">Belum punya akun? <a href="#daftar">Daftar</a></p>
    </div>
  </section>

  <!-- ===== HALAMAN DAFTAR =====
       Setelah Daftar, pengguna diarahkan ke halaman login. -->
  <section class="auth" id="daftar">
    <div class="auth-card">
      <img src="gambar/logo-nl-card.gif" alt="" class="auth-logo">
      <h1>Daftar</h1>

      <form>
        <label for="daftar-akun">Akun</label>
        <input type="text" id="daftar-akun" placeholder="Buat nama akun" autocomplete="username" required>

        <label for="daftar-password">Password</label>
        <input type="password" id="daftar-password" placeholder="Minimal 6 karakter" minlength="6" autocomplete="new-password" required>

        <p class="auth-hint">Isi akun dan password (minimal 6 karakter) dulu ya.</p>
        <a href="#login" class="btn-lime">Daftar</a>
      </form>

      <p class="auth-switch">Sudah punya akun? <a href="#login">Masuk</a></p>
    </div>
  </section>

</body>
</html>
